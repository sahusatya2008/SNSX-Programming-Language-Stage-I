[workspace]
members = [
    "compiler",
    "runtime",
    "vm",
    "stdlib",
    "ai_engine",
    "network_stack",
    "distributed_engine",
    "cli",
    "ide",
    "aeris_compiler",
    "aeris_runtime",
    "aeris_pkg",
    "aeris_fmt",
    "aeris_lint",
    "aeris_cli",
    "aeris_kernel_abi",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Codex"]
license = "Apache-2.0"
repository = "https://example.invalid/snsx"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.27"
notify = "6.1"
once_cell = "1.20"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
thiserror = "1.0"
toml = "0.8"
walkdir = "2.5"
x25519-dalek = { version = "2.0", features = ["static_secrets", "getrandom"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
aes-gcm-siv = "0.11"
